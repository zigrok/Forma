name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  thorvg-linux-native:
    runs-on: ${{ vars.TRACE_CI_RUNNERS == 'self-hosted' && fromJSON('["self-hosted","Linux","X64","yiazmat-linux-x64-emulated"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang g++ ninja-build python3-venv zlib1g-dev
      - name: Build Linux x64 ThorVG native assets
        run: make thorvg-spike
      - uses: actions/upload-artifact@v7
        with:
          name: thorvg-linux-x64-release-native
          path: artifacts/native/thorvg/linux-x64/output/libforma_thorvg.so
          if-no-files-found: error

  thorvg-macos-native:
    runs-on: ${{ vars.TRACE_CI_RUNNERS == 'self-hosted' && fromJSON('["self-hosted","macOS","ARM64"]') || 'macos-14' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build macOS arm64 ThorVG native assets
        run: make thorvg-spike
      - uses: actions/upload-artifact@v7
        with:
          name: thorvg-osx-arm64-release-native
          path: artifacts/native/thorvg/osx-arm64/output/libforma_thorvg.dylib
          if-no-files-found: error

  package:
    needs: [thorvg-linux-native, thorvg-macos-native]
    runs-on: ${{ vars.TRACE_CI_RUNNERS == 'self-hosted' && fromJSON('["self-hosted","Linux","X64","yiazmat-linux-x64-emulated"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v8
        with:
          name: thorvg-linux-x64-release-native
          path: artifacts/native/thorvg/linux-x64/output
      - uses: actions/download-artifact@v8
        with:
          name: thorvg-osx-arm64-release-native
          path: artifacts/native/thorvg/osx-arm64/output
      - name: Install Linux graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgl1-mesa-dri libglx0 libglx-mesa0 xvfb x11-utils
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(dotnet msbuild src/Forma/Forma.csproj -p:FormaRuntime=MonoGame -getProperty:Version -nologo)"
          test "$GITHUB_REF_NAME" = "v$version"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
      - name: Validate licenses and native redistribution notices
        run: bash scripts/check-compliance.sh
      - name: Verify deterministic default theme icons
        run: dotnet run --project tools/Forma.IconPipeline/Forma.IconPipeline.csproj -- verify
      - name: Validate runtime parity
        run: bash scripts/check-runtime-parity.sh
      - name: Review release public API
        run: bash scripts/check-release-api.sh
      - name: Validate XAML
        run: make CONFIGURATION=Release test-xaml
      - name: Validate package consumers
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          SDL_VIDEODRIVER: x11
        run: bash scripts/xvfb-run.sh -s '-screen 0 1440x900x24 +extension GLX' bash scripts/test-package-consumer.sh
      - name: Validate SVG package consumers
        run: bash scripts/test-svg-package-consumers.sh
      - name: Pack approved release manifest
        run: bash scripts/pack-release-packages.sh
      - name: Record artifact checksums
        working-directory: Artifacts/release-packages
        run: sha256sum *.nupkg *.snupkg > SHA256SUMS
      - name: Upload validated packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-release-packages
          path: |
            Artifacts/release-packages/*.nupkg
            Artifacts/release-packages/*.snupkg
            Artifacts/release-packages/SHA256SUMS
          if-no-files-found: error

  nativeaot:
    runs-on: ${{ vars.TRACE_CI_RUNNERS == 'self-hosted' && fromJSON('["self-hosted","macOS","ARM64"]') || 'macos-14' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Validate release NativeAOT matrix
        run: make nativeaot
      - name: Upload compact NativeAOT release evidence
        if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: nativeaot-osx-arm64-release-evidence
          path: |
            Artifacts/nativeaot/logs/*.log
            Artifacts/nativeaot/diagnostics/*.txt
            Artifacts/nativeaot/native-manifests/*.txt
          if-no-files-found: warn
          retention-days: 30

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, nativeaot]
    runs-on: ${{ vars.TRACE_CI_RUNNERS == 'self-hosted' && fromJSON('["self-hosted","Linux","X64","yiazmat-linux-x64-emulated"]') || 'ubuntu-latest' }}
    environment: nuget-production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Download validated packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-release-packages
          path: Artifacts/release-packages
      - name: Verify downloaded artifact
        working-directory: Artifacts/release-packages
        run: sha256sum --check SHA256SUMS
      - name: Revalidate approved manifest without rebuilding
        env:
          FORMA_RELEASE_VALIDATE_ONLY: true
        run: bash scripts/pack-release-packages.sh
      - name: Exchange GitHub OIDC token for NuGet API key
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish approved packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          while IFS=$'\t' read -r package_id publish_symbols; do
            dotnet nuget push "Artifacts/release-packages/$package_id.$version.nupkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --no-symbols \
              --skip-duplicate
            if [[ "$publish_symbols" == "true" ]]; then
              dotnet nuget push "Artifacts/release-packages/$package_id.$version.snupkg" \
                --api-key "$NUGET_API_KEY" \
                --source https://api.nuget.org/v3/index.json \
                --skip-duplicate
            fi
          done < <(jq -r '.packages[] | [.id, (if has("symbols") then .symbols else true end)] | @tsv' scripts/release-packages.json)
      - name: Verify NuGet.org indexing and clean restores
        run: bash scripts/verify-published-packages.sh "${GITHUB_REF_NAME#v}"
      - name: Create GitHub release from published artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            Artifacts/release-packages/*.nupkg \
            Artifacts/release-packages/*.snupkg \
            Artifacts/release-packages/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "Forma ${GITHUB_REF_NAME#v}"

  publish-documentation:
    needs: publish
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml