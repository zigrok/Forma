name: Documentation

on:
  push:
    branches: [main]
    paths:
      - ".config/dotnet-tools.json"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/docs.yml"
      - "Directory.Build.props"
      - "Makefile"
      - "config/cspell-project-words.txt"
      - "cspell.config.yaml"
      - "docs/**"
      - "package-lock.json"
      - "package.json"
      - "scripts/build-docs.sh"
      - "scripts/stage-docs-pages.mjs"
      - "src/**"
  pull_request:
    paths:
      - ".config/dotnet-tools.json"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/docs.yml"
      - "Directory.Build.props"
      - "Makefile"
      - "config/cspell-project-words.txt"
      - "cspell.config.yaml"
      - "docs/**"
      - "package-lock.json"
      - "package.json"
      - "scripts/build-docs.sh"
      - "scripts/stage-docs-pages.mjs"
      - "src/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  MSBUILDDISABLENODEREUSE: 1
  DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: 1

concurrency:
  group: documentation-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    outputs:
      channel: ${{ steps.context.outputs.channel }}
      maturity: ${{ steps.context.outputs.maturity }}
      version: ${{ steps.context.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Resolve documentation channel
        id: context
        shell: bash
        run: |
          version="$(dotnet msbuild src/Forma/Forma.csproj -p:FormaRuntime=MonoGame -getProperty:Version -nologo)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            channel="$GITHUB_REF_NAME"
            test "$channel" = "v$version"
            if [[ "$version" == *-* ]]; then maturity="Preview release"; else maturity="Stable release"; fi
          else
            channel="dev"
            maturity="Development preview"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "maturity=$maturity" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build strict Docfx site
        env:
          FORMA_DOCS_BASE_URL: https://zigrok.github.io/Forma/${{ steps.context.outputs.channel }}/
          FORMA_DOCS_MATURITY: ${{ steps.context.outputs.maturity }}
          FORMA_DOCS_VERSION: ${{ steps.context.outputs.version }}
        run: bash scripts/retry.sh make docs-check
      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --root-dir "${{ github.workspace }}"
            --cache
            --max-retries 3
            --retry-wait-time 2
            --exclude '^https://github\.com/zigrok/Forma/(blob|tree)/main/'
            './README.md'
            './docs/**/*.md'
          fail: true
          failIfEmpty: true
          jobSummary: true
          token: ${{ github.token }}
      - name: Upload review artifact
        uses: actions/upload-artifact@v7
        with:
          name: forma-documentation-${{ github.sha }}
          path: Artifacts/docs/site
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: forma-documentation-${{ github.sha }}
          path: Artifacts/docs/site
      - name: Stage immutable Pages tree
        shell: bash
        run: |
          pages_root="$RUNNER_TEMP/forma-pages"
          if git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add "$pages_root" origin/gh-pages
          else
            git worktree add --detach "$pages_root" HEAD
            git -C "$pages_root" switch --orphan gh-pages
          fi
          node scripts/stage-docs-pages.mjs \
            --site Artifacts/docs/site \
            --pages "$pages_root" \
            --channel "${{ needs.build.outputs.channel }}" \
            --version "${{ needs.build.outputs.version }}" \
            --maturity "${{ needs.build.outputs.maturity }}" \
            --revision "$GITHUB_SHA"
          git -C "$pages_root" config user.name github-actions
          git -C "$pages_root" config user.email github-actions@github.com
          git -C "$pages_root" add --all
          if ! git -C "$pages_root" diff --cached --quiet; then
            git -C "$pages_root" commit -m "Publish ${{ needs.build.outputs.channel }} documentation"
            git -C "$pages_root" push origin HEAD:gh-pages
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/forma-pages

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
