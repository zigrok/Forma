name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  MSBUILDDISABLENODEREUSE: 1
  DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: 1

jobs:
  runtime:
    name: ${{ matrix.runtime }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        runtime: [MonoGame, FNA]
    runs-on: ${{ matrix.os }}
    env:
      FORMA_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: bash scripts/check-compliance.sh
      - name: Verify deterministic default theme icons
        run: dotnet run --project tools/Forma.IconPipeline/Forma.IconPipeline.csproj -- verify
      - name: Unit and catalog inventory tests
        shell: bash
        run: bash scripts/retry.sh dotnet test tests/Forma.Tests/Forma.Tests.csproj --configuration Release -p:FormaRuntime="$FORMA_RUNTIME" --nologo
      - name: Forma XAML tests and sample host
        shell: bash
        run: |
          dotnet test tests/Forma.Xaml.Tests/Forma.Xaml.Tests.csproj --configuration Release -p:FormaRuntime="$FORMA_RUNTIME" --nologo
          dotnet test tests/Forma.Xaml.Tool.Tests/Forma.Xaml.Tool.Tests.csproj --configuration Release -p:FormaRuntime="$FORMA_RUNTIME" --nologo
          dotnet test tests/Forma.Xaml.Game.Tests/Forma.Xaml.Game.Tests.csproj --configuration Release -p:FormaRuntime="$FORMA_RUNTIME" --nologo
          dotnet test tests/Forma.Xaml.Compiler.Tests/Forma.Xaml.Compiler.Tests.csproj --configuration Release -p:FormaRuntime="$FORMA_RUNTIME" --nologo
          dotnet build tests/Forma.Xaml.Build.Integration/Forma.Xaml.Build.Integration.csproj --configuration Release -p:FormaRuntime="$FORMA_RUNTIME" --nologo
          test -f "tests/Forma.Xaml.Build.Integration/obj/$FORMA_RUNTIME/Package/Release/net10.0/FormaXaml/compile.stamp"
          dotnet build "samples/Forma.Xaml.Game.$FORMA_RUNTIME/Forma.Xaml.Game.$FORMA_RUNTIME.csproj" --configuration Release -p:FormaRuntime="$FORMA_RUNTIME" --nologo
          dotnet build "samples/Forma.QuickStart.$FORMA_RUNTIME/Forma.QuickStart.$FORMA_RUNTIME.csproj" --configuration Release -p:FormaRuntime="$FORMA_RUNTIME" --nologo
      - name: Compile render tests
        shell: bash
        run: dotnet build tests/Forma.RenderTests/Forma.RenderTests.csproj --configuration Release -p:FormaRuntime="$FORMA_RUNTIME" --nologo
      - name: Build selected catalog host
        shell: bash
        run: |
          if [[ "$FORMA_RUNTIME" == "FNA" ]]; then
            project="samples/Forma.Catalog.FNA/Forma.Catalog.FNA.csproj"
          else
            project="samples/Forma.Catalog.MonoGame/Forma.Catalog.MonoGame.csproj"
          fi
          dotnet build "$project" --configuration Release -p:FormaRuntime="$FORMA_RUNTIME" --nologo
      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgl1-mesa-dri libglx0 libglx-mesa0 mesa-vulkan-drivers vulkan-tools xvfb
          software_icd=$(find /opt/google/chrome -name 'vk_swiftshader_icd.json' -print -quit)
          software_icd=${software_icd:-$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)}
          test -n "$software_icd"
          echo "VK_ICD_FILENAMES=$software_icd" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$software_icd" >> "$GITHUB_ENV"
      - name: Validate Linux selected runtime
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          SDL_VIDEODRIVER: ${{ matrix.runtime == 'FNA' && 'offscreen' || 'x11' }}
          FNA3D_FORCE_DRIVER: OpenGL
          FNA3D_OPENGL_WINDOW_DEPTHSTENCILFORMAT: None
        run: |
          if [[ "$FORMA_RUNTIME" == "FNA" ]]; then
            env -u VK_ICD_FILENAMES -u VK_DRIVER_FILES SvgBackend=Skia FormaRuntime=FNA xvfb-run -a -s '-screen 0 1440x900x24 +extension GLX' bash scripts/check-catalog-smoke.sh
            env -u VK_ICD_FILENAMES -u VK_DRIVER_FILES xvfb-run -a -s '-screen 0 1440x900x24 +extension GLX' bash scripts/check-quick-start.sh
            env -u VK_ICD_FILENAMES -u VK_DRIVER_FILES xvfb-run -a -s '-screen 0 1440x900x24 +extension GLX' dotnet test tests/Forma.RenderTests/Forma.RenderTests.csproj --configuration Release -p:FormaRuntime=FNA --no-build --nologo
            env -u VK_ICD_FILENAMES -u VK_DRIVER_FILES xvfb-run -a -s '-screen 0 1440x900x24 +extension GLX' dotnet run --project tests/Forma.SvgRenderSmoke/Forma.SvgRenderSmoke.csproj --configuration Release -p:FormaRuntime=FNA -p:SvgBackend=Skia
          else
            xvfb-run -a -s '-screen 0 1440x900x24 +extension GLX' vulkaninfo --summary
            SvgBackend=Skia FormaRuntime=MonoGame xvfb-run -a -s '-screen 0 1440x900x24 +extension GLX' bash scripts/check-catalog-smoke.sh
            xvfb-run -a -s '-screen 0 1440x900x24 +extension GLX' bash scripts/check-quick-start.sh
            xvfb-run -a -s '-screen 0 1440x900x24 +extension GLX' dotnet test tests/Forma.RenderTests/Forma.RenderTests.csproj --configuration Release -p:FormaRuntime=MonoGame --no-build --nologo
            xvfb-run -a -s '-screen 0 1440x900x24 +extension GLX' dotnet run --project tests/Forma.SvgRenderSmoke/Forma.SvgRenderSmoke.csproj --configuration Release -p:FormaRuntime=MonoGame -p:SvgBackend=Skia
            SvgBackend=Skia MonoGamePlatform=DesktopVK FormaNativeRuntime=true CatalogBackend=Vulkan xvfb-run -a -s '-screen 0 1440x900x24 +extension GLX' bash scripts/check-catalog-smoke.sh
            MonoGamePlatform=DesktopVK FormaNativeRuntime=true xvfb-run -a -s '-screen 0 1440x900x24 +extension GLX' dotnet run --project tests/Forma.SvgRenderSmoke/Forma.SvgRenderSmoke.csproj --configuration Release -p:FormaRuntime=MonoGame -p:MonoGamePlatform=DesktopVK -p:FormaNativeRuntime=true -p:SvgBackend=Skia
          fi
      - name: Validate Linux FNA video
        if: runner.os == 'Linux' && matrix.runtime == 'FNA'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          SDL_VIDEODRIVER: offscreen
          SDL_AUDIODRIVER: dummy
          FNA3D_FORCE_DRIVER: OpenGL
          FNA3D_OPENGL_WINDOW_DEPTHSTENCILFORMAT: None
        run: env -u VK_ICD_FILENAMES -u VK_DRIVER_FILES xvfb-run -a -s '-screen 0 1440x900x24 +extension GLX' bash scripts/check-fna-video-smoke.sh
      - name: Compare Linux peer rendering
        if: runner.os == 'Linux' && matrix.runtime == 'MonoGame'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          SDL_VIDEODRIVER: x11
          FormaCatalogViewportWidth: 800
          FormaCatalogViewportHeight: 480
        run: SvgBackend=Skia bash scripts/retry.sh xvfb-run -a -s '-screen 0 1440x900x24 +extension GLX' bash scripts/check-catalog-render-parity.sh
      - name: Validate Windows selected runtime
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [[ "$FORMA_RUNTIME" == "MonoGame" ]]; then
            SvgBackend=Skia MonoGamePlatform=Windows CatalogBackend=WindowsDX FormaRuntime=MonoGame bash scripts/check-catalog-smoke.sh
            MonoGamePlatform=Windows bash scripts/check-quick-start.sh
            dotnet test tests/Forma.RenderTests/Forma.RenderTests.csproj --configuration Release -p:FormaRuntime=MonoGame -p:MonoGamePlatform=Windows --nologo
            dotnet run --project tests/Forma.SvgRenderSmoke/Forma.SvgRenderSmoke.csproj --configuration Release -p:FormaRuntime=MonoGame -p:MonoGamePlatform=Windows -p:SvgBackend=Skia
          else
            SvgBackend=Skia FormaRuntime=FNA bash scripts/check-catalog-smoke.sh
            bash scripts/check-quick-start.sh
            dotnet test tests/Forma.RenderTests/Forma.RenderTests.csproj --configuration Release -p:FormaRuntime=FNA --no-build --nologo
            dotnet run --project tests/Forma.SvgRenderSmoke/Forma.SvgRenderSmoke.csproj --configuration Release -p:FormaRuntime=FNA -p:SvgBackend=Skia
          fi
      - name: Validate Windows FNA video
        if: runner.os == 'Windows' && matrix.runtime == 'FNA'
        shell: bash
        env:
          SDL_AUDIODRIVER: dummy
        run: bash scripts/check-fna-video-smoke.sh
      - name: Compare Windows peer rendering
        if: runner.os == 'Windows' && matrix.runtime == 'MonoGame'
        shell: bash
        env:
          FormaRenderParityCoverageTolerance: 0.15
          FormaRenderParityColorTolerance: 0.03
        run: SvgBackend=Skia MonoGamePlatform=Windows CatalogBackend=WindowsDX bash scripts/retry.sh bash scripts/check-catalog-render-parity.sh
      - name: Validate macOS selected runtime
        if: runner.os == 'macOS'
        shell: bash
        env:
          FormaCatalogViewportWidth: 1440
          FormaCatalogViewportHeight: 900
        run: |
          SvgBackend=Skia FormaRuntime="$FORMA_RUNTIME" bash scripts/check-catalog-smoke.sh
          bash scripts/check-quick-start.sh
          dotnet run --project tests/Forma.SvgRenderSmoke/Forma.SvgRenderSmoke.csproj --configuration Release -p:FormaRuntime="$FORMA_RUNTIME" -p:SvgBackend=Skia
      - name: Validate macOS render-test isolation
        if: runner.os == 'macOS'
        shell: bash
        run: dotnet test tests/Forma.RenderTests/Forma.RenderTests.csproj --configuration Release -p:FormaRuntime="$FORMA_RUNTIME" --no-build --nologo
      - name: Validate macOS FNA video
        if: runner.os == 'macOS' && matrix.runtime == 'FNA'
        shell: bash
        run: bash scripts/check-fna-video-smoke.sh
      - name: Compare macOS peer rendering
        if: runner.os == 'macOS' && matrix.runtime == 'MonoGame'
        shell: bash
        env:
          FormaCatalogViewportWidth: 1024
          FormaCatalogViewportHeight: 646
        run: SvgBackend=Skia bash scripts/retry.sh bash scripts/check-catalog-render-parity.sh
      - name: Install macOS Metal build prerequisites
        if: runner.os == 'macOS' && matrix.runtime == 'MonoGame'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: false
      - name: Set up Premake
        if: runner.os == 'macOS' && matrix.runtime == 'MonoGame'
        shell: bash
        run: |
          premake_directory="$RUNNER_TEMP/premake-5.0.0-beta2"
          premake_archive="$RUNNER_TEMP/premake-5.0.0-beta2-macosx.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$premake_archive" \
            https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-macosx.tar.gz
          printf '%s  %s\n' \
            620778e24847d4f8e2380cd98922977afec77cc8e805a77edcae1c05e0f6d44a \
            "$premake_archive" | shasum -a 256 --check
          mkdir -p "$premake_directory"
          tar -xzf "$premake_archive" -C "$premake_directory"
          echo "$premake_directory" >> "$GITHUB_PATH"
          "$premake_directory/premake5" --version
      - name: Check out MonoGame Metal runtime source
        if: runner.os == 'macOS' && matrix.runtime == 'MonoGame'
        uses: actions/checkout@v7
        with:
          repository: zigrok/MonoGame
          ref: 99716f1b02ba9db2130c754606d6b0303d039d15
          path: .native/MonoGame
          submodules: false
      - name: Initialize MonoGame Metal runtime submodules
        if: runner.os == 'macOS' && matrix.runtime == 'MonoGame'
        working-directory: .native/MonoGame
        shell: bash
        run: |
          git submodule sync --recursive
          git config submodule.external/MonoGame.Templates.url https://github.com/MonoGame/MonoGame.Templates.git
          git submodule update --init --recursive
      - name: Build MonoGame Metal runtime
        if: runner.os == 'macOS' && matrix.runtime == 'MonoGame'
        working-directory: .native/MonoGame
        env:
          NoWarn: "1591"
        run: ./build.sh --target='Build Native Metal'
      - name: Validate MonoGame Metal catalog
        if: runner.os == 'macOS' && matrix.runtime == 'MonoGame'
        env:
          MonoGamePlatform: DesktopVK
          FormaNativeRuntime: true
          CatalogBackend: Metal
          NativeRuntimePath: ${{ github.workspace }}/.native/MonoGame/Artifacts/native/mgruntime/desktopmetal/macosx/Release/libmgruntime.dylib
        run: SvgBackend=Skia bash scripts/check-catalog-smoke.sh

  # The browser probe is Forma's own proof: it compiles Forma XAML and renders seven locales
  # through the browser runtime. It lives here rather than in a consumer so the proof belongs
  # with the code it exercises. The MonoGame browser framework is checked out from the fork;
  # only a browser-capable ref has MonoGame.Framework.Browser.csproj.
  browser-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          # The browser build's emsdk-env.sh requires exactly the matched 10.0.103 / wasm-tools
          # 10.0.110 toolchain, so this job pins it rather than following the 10.0.x channel.
          dotnet-version: 10.0.103
      - name: Install the browser workload
        run: dotnet workload install wasm-tools --version 10.0.110
      - name: Check out the MonoGame browser runtime source
        uses: actions/checkout@v7
        with:
          repository: zigrok/MonoGame
          ref: dea990e6fbc02dd034c9801c6c9b85eb03d74e60
          path: .native/MonoGame
          submodules: false
      - name: Initialize MonoGame submodules
        working-directory: .native/MonoGame
        shell: bash
        run: |
          git submodule sync --recursive
          git config submodule.external/MonoGame.Templates.url https://github.com/MonoGame/MonoGame.Templates.git
          git submodule update --init --recursive
      # The probe compiles against the MonoGame browser framework and its effect compiler, which
      # the fork's native browser build produces; without it build-browser-effect.sh finds no
      # mggl-shader or mgfxc.dll.
      - name: Build the MonoGame browser runtime
        shell: bash
        run: bash .native/MonoGame/native/browser/build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the probe browser
        shell: bash
        run: |
          npm install --no-save @playwright/test@1.62.1
          npx playwright install --with-deps chromium
      - name: Build and run the browser probe
        shell: bash
        env:
          MonoGameRoot: ${{ github.workspace }}/.native/MonoGame
          MonoGameProjectPath: ${{ github.workspace }}/.native/MonoGame/MonoGame.Framework/MonoGame.Framework.Browser.csproj
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/@playwright/test/index.mjs
          # A headless Linux runner has no WebGL for Firefox or WebKit; chromium renders through
          # SwiftShader, and a desktop machine still runs all three by default.
          FORMA_PROBE_BROWSERS: chromium
        run: |
          bash tests/Forma.Browser.Probe/prepare.sh
          bash tests/Forma.Browser.Probe/run.sh
      - name: Upload browser probe evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: forma-browser-probe
          path: |
            artifacts/browser/probe-*.png
            artifacts/browser/probe-results.json
            artifacts/browser/frozen-platform-sha256.json
          if-no-files-found: warn

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: bash scripts/check-runtime-parity.sh
      - name: Review release public API
        run: bash scripts/check-release-api.sh

  package-consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install Linux graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgl1-mesa-dri libglx0 libglx-mesa0 mesa-vulkan-drivers xvfb
          software_icd=$(find /opt/google/chrome -name 'vk_swiftshader_icd.json' -print -quit)
          software_icd=${software_icd:-$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)}
          test -n "$software_icd"
          echo "VK_ICD_FILENAMES=$software_icd" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$software_icd" >> "$GITHUB_ENV"
      - name: Validate package consumers
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          SDL_VIDEODRIVER: x11
        run: env -u VK_ICD_FILENAMES -u VK_DRIVER_FILES xvfb-run -a -s '-screen 0 1440x900x24 +extension GLX' bash scripts/test-package-consumer.sh
      - uses: actions/upload-artifact@v7
        with:
          name: forma-peer-packages
          path: Artifacts/packages/*/*.*nupkg
          if-no-files-found: error

  nativeaot:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Validate packed trim-only and NativeAOT consumers
        run: make nativeaot

  thorvg-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Validate Linux x64 ThorVG matrix
        run: make thorvg-linux
      - name: Upload ThorVG Linux evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: forma-thorvg-linux-x64-evidence
          path: |
            artifacts/native/thorvg/linux-x64/output/**
            artifacts/svg-comparison/**
            artifacts/svg-benchmarks/**
            artifacts/thorvg-aot/**
            artifacts/thorvg-static-host/**
          if-no-files-found: warn

  thorvg-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build and validate native ThorVG
        run: |
          make thorvg-spike
          THORVG_SANITIZE=true THORVG_ARTIFACTS_DIR="$RUNNER_TEMP/forma-thorvg-sanitized" make thorvg-spike
      - name: Validate managed, package, conformance, and GPU matrices
        run: |
          make svg-selection
          dotnet test tests/Forma.ThorVG.Tests/Forma.ThorVG.Tests.csproj --configuration Release -p:FormaRuntime=MonoGame --nologo
          dotnet test tests/Forma.ThorVG.Tests/Forma.ThorVG.Tests.csproj --configuration Release -p:FormaRuntime=FNA --nologo
          make svg-packages
          make svg-compare
          make thorvg-render
          make thorvg-catalog
      - name: Validate ThorVG dynamic and static NativeAOT
        run: |
          make thorvg-nativeaot
          make thorvg-static-host
      - name: Upload ThorVG macOS evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: forma-thorvg-macos-arm64-evidence
          path: |
            artifacts/native/thorvg/osx-arm64/output/**
            artifacts/svg-comparison/**
            artifacts/svg-benchmarks/**
            artifacts/catalog/thorvg/**
            artifacts/thorvg-aot/**
            artifacts/thorvg-static-host/**
          if-no-files-found: warn
